{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
  <h1 class="h4">Sign in</h1>
  <form method="post" class="card card-body">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert-danger py-2">Username or password is incorrect.</div>{% endif %}
    <div class="mb-3"><label class="form-label">Username</label>{{ form.username }}</div>
    <div class="mb-3"><label class="form-label">Password</label>{{ form.password }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary">Sign in</button>
  </form>
</div></div>
{% endblock %}
